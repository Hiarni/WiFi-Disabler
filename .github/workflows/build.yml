name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "WiFi-Disabler-v$v.apk"

      - name: Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          apk="WiFi-Disabler-v$VERSION.apk"
          # Tags are never moved: a new release needs a new version in app/build.gradle.kts.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag existiert schon – kein neues Release. Für ein Release die Version erhöhen."
            exit 0
          fi
          section() { awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f && /^- /' "$1"; }
          de=$(section CHANGELOG.md)
          en=$(section CHANGELOG.en.md)
          if [ -z "$de" ] || [ "$(echo "$de" | wc -l)" != "$(echo "$en" | wc -l)" ]; then
            echo "::error::$VERSION fehlt in CHANGELOG.md/CHANGELOG.en.md oder die Punkte passen nicht zusammen."
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main"
          {
            echo "### 🇩🇪 Deutsch"; echo
            echo "$de"; echo
            echo "### 🇬🇧 English"; echo
            echo "$en"; echo
            echo "---"; echo
            echo "🇩🇪 [Einrichtung]($url/README.md) · [Alle Änderungen]($url/CHANGELOG.md) &nbsp;·&nbsp; 🇬🇧 [Setup]($url/README.en.md) · [Changelog]($url/CHANGELOG.en.md)"
          } > notes.md
          gh release create "$tag" "$apk" --title "WiFi Disabler v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            [ "$t" = "$tag" ] || gh release delete "$t" --yes --cleanup-tag
          done
